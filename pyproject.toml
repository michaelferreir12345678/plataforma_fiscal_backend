[project]
name = "plataforma-fiscal-backend"
version = "0.1.0"
description = "Backend da Plataforma de Inteligência Fiscal (SICONFI) — API + modelo de dados"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "psycopg2-binary==2.9.10",
    "alembic==1.14.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "email-validator==2.2.0",
    "pyjwt==2.10.1",
    "passlib==1.7.4",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "tenacity==9.0.0",
    "openpyxl==3.1.5",
    "pypdf==5.1.0",
    "reportlab==4.2.5",
    "python-pptx==1.0.2",
    # 1.75.0, não 1.16.1: o SDK antigo não conhecia ``Part.thought_signature`` e o
    # descartava ao desserializar a resposta. Com *function calling* (Sprint IA-1a) e um
    # modelo com raciocínio, a assinatura tem de voltar junto do histórico — sem ela a API
    # recusa com 400 INVALID_ARGUMENT na segunda volta do laço de ferramentas. Sem o
    # function calling o campo nunca era exigido, por isso o problema só apareceu agora.
    "google-genai==1.75.0",
    "redis==8.0.1",
    "rq==2.10.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.4",
    "ruff==0.8.4",
    "mypy==1.14.0",
    "types-passlib",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# O conjunto dourado da IA-6 é dado versionado dentro do pacote (não é seed de banco).
# Sem isto ele fica de fora do wheel e a avaliação só rodaria a partir do checkout.
[tool.setuptools.package-data]
"app.modules.evaluation" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]  # FastAPI usa Depends() como default de argumento

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts", "tests"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["app"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
