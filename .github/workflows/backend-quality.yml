name: Backend quality

# O backend não tinha CI: lint, tipos e 400 testes dependiam de alguém lembrar de
# rodá-los. Aqui eles passam a ser condição de merge.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint, tipos, testes e auditoria
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

    env:
      # Credenciais de serviço efêmero do CI — não são segredo e não valem fora daqui.
      DATABASE_URL: postgresql+psycopg2://plataforma_app:plataforma_app@localhost:5432/plataforma_fiscal
      DATABASE_ADMIN_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/postgres
      DB_NAME: plataforma_fiscal
      APP_DB_ROLE: plataforma_app
      APP_DB_PASSWORD: plataforma_app
      JWT_SECRET: ci-secret-efemero
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test
      # O assistente roda offline no CI: nada de chamada de rede nem de chave real.
      ASSISTANT_PROVIDER: local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Tipos (mypy)
        run: mypy src

      - name: Testes
        run: pytest -q

      # A validação fiscal precisa de dado real ingerido; no CI não há. Roda apenas
      # onde o ambiente de homologação estiver disponível.
      - name: Validação fiscal contra os demonstrativos oficiais
        if: ${{ vars.VALIDACAO_FISCAL_DSN != '' }}
        env:
          DATABASE_URL: ${{ vars.VALIDACAO_FISCAL_DSN }}
          DATABASE_ADMIN_URL: ${{ vars.VALIDACAO_FISCAL_DSN }}
        run: python -m scripts.validacao_fiscal --saida validacao_fiscal.md

      - name: Auditoria de dependências
        # `pip-audit` falha o build em vulnerabilidade conhecida com correção
        # disponível. Sem `|| true`: aviso que não quebra nada não é auditoria.
        run: |
          pip install pip-audit
          pip-audit --strict --desc

      - name: Anexar evidências
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality
          if-no-files-found: ignore
          retention-days: 14
          path: |
            validacao_fiscal.md
